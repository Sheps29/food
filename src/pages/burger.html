<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Restaurants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <header>
    <div class="wrapper">
      <img src="../images/logo.png" alt="logo" class="logo">
      <a href="#" class="location">Deliver to: <img src="../images/map-marker-yellow.svg" alt="map"><span>Current Location </span> Mohammadpur Bus Stand, Dhaka</a>
      <div class="menu">
        <a href="#" class="menu-search"><img src="../images/search.svg" alt="search">Search Food</a>
        <button class="user" id="desktop-login"><img src="../images/user.svg" alt="user">Login</button>
      </div>
      <button class="burger" id="burger"><img src="../images/bg.svg" alt="bg"></button>
    </div>
    <div class="mobile-menu" id="mobile-menu">
      <div class="mobile-menu-content">
        <a href="#" class="menu-search"><img src="../images/search.svg" alt="search">Search Food</a>
        <button class="user" id="mobile-login"><img src="../images/user.svg" alt="user">Login</button>
      </div>
    </div>
  </header>
  <main>
    <ul>
      <li class="rest-item" id="6">
            <div class="food">
              <img src="../images/kfc.png" alt="kfc" class="food-img">
              <div class="feature">
                <button class="percent">
                  <img src="../images/percent.svg" alt="percent">
                  25% off
                </button>
                <button class="fast">
                  <img src="../images/fast.svg" alt="fast">
                  Fast
                </button>
              </div>
            </div>
            <div class="rest">
              <img src="../images/kfc-logo.svg" alt="kfc" class="logo-rest">
              <div class="name">
                <h4 class="title">Kuakata Fried Chicken</h4>
                <span class="star"><img src="../images/star.svg" alt="star" class="star-icon">53</span>
              </div>
            </div>
            <span class="open status">Open Now</span>
          </li>
        <li class="rest-item" id="1">
            <div class="food">
              <img src="../images/foodworld.png" alt="foodworld" class="food-img">
              <div class="feature">
                <button class="percent">
                  <img src="../images/percent.svg" alt="percent">
                  20% off
                </button>
                <button class="fast">
                  <img src="../images/fast.svg" alt="fast">
                  Fast
                </button>
              </div>
            </div>
            <div class="rest">
              <img src="../images/foodworld-logo.svg" alt="foodworld" class="logo-rest">
              <div class="name">
                <h4 class="title">Foodworld</h4>
                <span class="star"><img src="../images/star.svg" alt="star" class="star-icon">46</span>
              </div>
            </div>
            <span class="close status">Opens tomorrow</span>
          </li>
    </ul>
  </main>
</body>
